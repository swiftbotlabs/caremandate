<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mum's care visits</title><link rel="stylesheet" href="/web/style.css"></head>
<body><main>
<h1>Mum's care visits</h1><p class="sub" id="rules">Loading…</p>
<div class="card"><div class="stat"><div><b id="sPaid">-</b>paid</div><div><b id="sWait">-</b>waiting</div><div><b id="sNo">-</b>not paid</div></div></div>
<div class="card"><h3 style="margin:0 0 6px">Messages from your agent</h3><div id="msgs"></div></div>
<div class="card a2a-card" id="a2aCard" hidden><h3 style="margin:0 0 6px">Make-up visits: your agent and the agency's agent</h3><p class="small" id="a2aRules"></p><div id="a2a"></div></div>
<div class="card"><h3 style="margin:0 0 6px">Every visit</h3><div id="visits"></div></div>
<p class="small" id="chain"></p>
</main>
<script type="module">
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = (t) => new Date(t * 1000).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Seoul' });
const NOTE = { RefusedBySigningFirewall: 'your agent refused to sign: HSP asked for more than the mandate', FailedBeforeSubmit: 'did not reach HSP', HspPaymentFailed: 'HSP: payment failed, no money moved', Unsettled: 'HSP has not confirmed it yet; checked again, never paid twice' };
function payLine(v, ex) {
  const p = v.payment, o = v.onchain || {};
  if (!p) return '';
  if (p.mode === 'mock') return '<div class="small">HSP MOCK (test run)</div>';
  const st = p.hspStatus && p.status === 'paying' ? p.hspStatus : p.status;
  let t = 'HSP ' + esc(st) + (p.flowId ? ' · flow …' + esc(String(p.flowId).slice(-12)) : '');
  if (v.status === 'Paid' && o.paidRaw && o.paidRaw !== '0') t += ` · $${(Number(o.paidRaw) / 1e6).toFixed(2)} test USDC`;
  if (ex && p.markPaidTx) t += ` · <a href="${esc(ex)}/tx/${esc(p.markPaidTx)}" target="_blank" rel="noopener">on chain</a>`;
  if (o.agencyAck) t += ' · <b class="ack">agency confirmed receipt</b>';
  else if (v.status === 'Paid' && o.settlementTx && !/^0x0+$/.test(o.settlementTx)) t += ' · agency checking…';
  if (v.status === 'Confirmed' && ['failed', 'retrying', 'unsettled'].includes(p.status)) t += `<div class="small warn">Confirmed, not paid yet: ${esc(NOTE[p.kind] || p.error || '')}${p.status === 'retrying' ? '. Trying again automatically.' : ''}${o.issues ? ` (${o.issues} attempt${o.issues > 1 ? 's' : ''} recorded on chain)` : ''}</div>`;
  if ((p.attempts || []).length && v.status === 'Paid') t += `<div class="small">Paid on attempt ${p.attempts.length + 1}; the earlier one moved no money.</div>`;
  return `<div class="small">${t}</div>`;
}
// The agent's note check: what the carer wrote, and whether the agent paid or held it (and why).
function reviewLine(v) {
  const r = v.review, note = v.receipt?.note;
  let t = note ? `<div class="small note">Carer's note: “${esc(note)}”</div>` : '';
  if (!r) return t;
  const src = r.source === 'model+rules' ? 'note read by your agent (model + rules)' : r.source === 'rules' ? 'note checked by your agent (rules; model unavailable)' : r.source === 'off' ? 'note check OFF (test)' : r.source === 'a2a' ? 'make-up check against the agreement your agent signed' : 'note check';
  if (r.makeup?.matched) t += `<div class="small">Make-up for visit ${esc(r.makeup.missedVisitId)}: matches the slot and price your agent agreed with the agency's agent.</div>`;
  if (r.decision === 'pay') return t + `<div class="small">${esc(src)}: nothing unusual, paid without asking you.</div>`;
  t += `<div class="small warn held"><b>Your agent held this payment</b> (${esc(src)}):<ul>${(r.reasons || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  t += r.released ? `You checked it and released the payment.</div>` : `Nothing has been paid. Mum said the visit happened.</div>`;
  return t;
}
const heldByAgent = (v) => v.status === 'Confirmed' && v.review?.decision === 'hold' && !v.review.released && !v.payment;
const LABEL = { Paid: 'paid', Rejected: 'did not happen', Held: 'waits for you', Posted: 'waiting for Mum', Confirmed: 'paying…' };
async function load() {
  const [cfg, vs, ms] = await Promise.all(['/api/config', '/api/visits', '/api/messages'].map((u) => fetch(u).then((r) => r.json())));
  const fx = cfg.fx ? ` Paid in test USDC at ${Number(cfg.fx.krwPerUsd).toLocaleString('en-US')} won per dollar (${cfg.fx.source}, ${cfg.fx.date})${cfg.fx.scale > 1 ? `, testnet scale 1:${cfg.fx.scale}` : ''}: ${Number(cfg.perVisitCap).toLocaleString('en-US')} won = $${cfg.capUsd}.` : '';
  document.getElementById('rules').textContent = `Your rules: at most ${cfg.weeklyMax} visits a week, at most ${Number(cfg.perVisitCap).toLocaleString('en-US')} won a visit. Only visits Mum confirms are paid.${fx}`;
  document.getElementById('sPaid').textContent = vs.filter((v) => v.status === 'Paid').length;
  document.getElementById('rules').textContent += cfg.carePlan ? ` Every visit: ${cfg.carePlan.tasks.join(', ')}, at least ${cfg.carePlan.minMinutes} minutes; your agent reads each note and holds anything odd for you.` : '';
  document.getElementById('sWait').textContent = vs.filter((v) => ['Posted', 'Held', 'Confirmed'].includes(v.status)).length;
  document.getElementById('sNo').textContent = vs.filter((v) => v.status === 'Rejected').length;
  document.getElementById('msgs').innerHTML = ms.length ? ms.slice(0, 6).map((m) => `<div class="msg"><time>${esc(new Date(m.at).toLocaleString('en-GB', { timeZone: 'Asia/Seoul' }))}</time>${esc(m.text)}</div>`).join('') : '<p class="small">Nothing yet.</p>';
  const ex = cfg.explorer;
  document.getElementById('visits').innerHTML = vs.slice().reverse().map((v) => `<div class="row"><div><b>${esc(day(v.visitTime))}</b> · ${esc(v.receipt?.carer || 'carer')} · ${Number(v.amount).toLocaleString('en-US')} won
    ${v.price?.usd ? `<span class="small"> = $${esc(v.price.usd)}</span>` : ''}${reviewLine(v)}${payLine(v, ex)}</div>
    <div>${heldByAgent(v) ? `<button class="release" data-v="${v.id}">Pay anyway</button>` : v.status === 'Held' ? `<button class="approve" data-v="${v.id}">Approve</button>` : v.status === 'Confirmed' && v.payment?.status === 'failed' && v.payment?.retryable ? `<button class="retry" data-v="${v.id}">Try payment again</button>` : `<span class="pill ${esc(v.status)}">${esc(v.status === 'Confirmed' && ['failed', 'unsettled', 'retrying'].includes(v.payment?.status) ? 'confirmed, not paid yet' : (LABEL[v.status] || v.status))}</span>`}</div></div>`).join('') || '<p class="small">No visits yet.</p>';
  document.querySelectorAll('.approve').forEach((b) => b.onclick = async () => { b.disabled = true; await fetch('/api/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visitId: +b.dataset.v }) }); load(); });
  document.querySelectorAll('.release').forEach((b) => b.onclick = async () => { b.disabled = true; await fetch('/api/release', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visitId: +b.dataset.v }) }); load(); });
  document.querySelectorAll('.retry').forEach((b) => b.onclick = async () => { b.disabled = true; await fetch('/api/retry', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visitId: +b.dataset.v }) }); load(); });
  // agent to agent: each make-up proposal from the agency's agent, and the decision your agent signed and put on chain
  const a2a = await fetch('/api/a2a').then((r) => r.json()).catch(() => []);
  const card = document.getElementById('a2aCard'); card.hidden = !a2a.length;
  const kst = (t) => new Date(Number(t) * 1000).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Seoul' });
  const mr = cfg.makeupRules;
  if (mr) document.getElementById('a2aRules').textContent = `Your rules for a make-up: ${String(mr.startHour).padStart(2, '0')}:00 to ${mr.endHour}:00 Korea time, within ${mr.maxDaysAfter} days of the missed visit, ${mr.minMinutes} to ${mr.maxMinutes} minutes, never dearer than the missed visit, and inside your ${cfg.weeklyMax}-a-week limit. Your agent signs each answer and records it on chain.`;
  const used = new Set(vs.filter((v) => v.review?.makeup?.matched).map((v) => v.review.makeup.decisionHash));
  document.getElementById('a2a').innerHTML = a2a.map((d) => `<div class="row a2a"><div><b>Visit ${esc(d.missedVisitId)} missed</b> · offer: ${esc(kst(d.proposal.slotStart))} to ${esc(kst(d.proposal.slotEnd).slice(-5))}, ${Number(d.proposal.amount).toLocaleString('en-US')} won
    <div class="small">${d.accept ? (used.has(d.decisionHash) ? 'Accepted. The make-up happened and Mum confirmed it.' : 'Accepted: fits your rules. Paid only if Mum confirms it.') : 'Declined: ' + esc((d.reasons || []).map((x) => x.text).join(' '))}</div>
    <div class="small">signed by both agents · ${ex ? `<a href="${esc(ex)}/tx/${esc(d.anchorTx)}" target="_blank" rel="noopener">on chain</a>` : `on chain <code>${esc(String(d.anchorTx).slice(0, 12))}…</code>`}</div></div>
    <div><span class="pill ${d.accept ? 'Paid' : 'Rejected'}">${d.accept ? 'accepted' : 'declined'}</span></div></div>`).join('');
  document.getElementById('chain').innerHTML = `Rules and every visit are on ${esc(cfg.network)}: contract ${ex ? `<a href="${esc(ex)}/address/${esc(cfg.contract)}" target="_blank" rel="noopener"><code>${esc(cfg.contract)}</code></a>` : `<code>${esc(cfg.contract)}</code>`}. Payments: HSP ${cfg.hspMode === 'mock' ? 'MOCK (test run, no money moves)' : 'QA, settling on ' + esc(cfg.hspNetwork)}.`;
}
load(); setInterval(load, 4000);
</script></body></html>
